<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Letras e Palavras</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 text-primary fw-bold">Contador de Texto</h2>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="texto" class="form-label">Digite ou cole seu texto abaixo:</label>
                                <textarea class="form-control" id="texto" name="texto" rows="6" placeholder="Escreva algo aqui...">{{ texto }}</textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Contar</button>
                        </form>

                        {% if request.method == "POST" %}
                            <hr class="my-4">
                            <h4 class="mb-3">Resultados:</h4>
                            <div class="row text-center">
                                <div class="col-4">
                                    <div class="p-3 border bg-white rounded shadow-sm">
                                        <h5 class="text-muted">Palavras</h5>
                                        <p class="fs-4 fw-bold text-dark mb-0">{{ total_palavras }}</p>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 border bg-white rounded shadow-sm">
                                        <h5 class="text-muted">Com Espaços</h5>
                                        <p class="fs-4 fw-bold text-dark mb-0">{{ total_caracteres }}</p>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-3 border bg-white rounded shadow-sm">
                                        <h5 class="text-muted">Sem Espaços</h5>
                                        <p class="fs-4 fw-bold text-dark mb-0">{{ total_caracteres_sem_espaco }}</p>
                                    </div>
                                </div>
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
